# racing.twtools.cc 每週自動更新（GitHub Actions cron）
#
# 自動化節奏是「週」不是「日」：
#   - 台北週一 06:00（= 週日 22:00 UTC）：歐洲週日夜賽後主更新
#   - 台北週六/週日 06:00（= 週五/週六 22:00 UTC）：sprint 週末承接衝刺賽果
#   非賽週或賽果未出：fetch 比對快照無變化 → 安靜跳過（不重建不部署，CI 綠燈）。
#   手動測試：Actions 分頁 → Run workflow（workflow_dispatch）。
#
# 需要的 repo secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   = ~/.config/cloudflare/foootball-tools-2019.token 的值
#                            （2019 帳號，需 Workers Scripts:Edit）
#   CLOUDFLARE_ACCOUNT_ID  = 2f123fdee05d453c8a077b6ba541c45d
#   （jolpica 免金鑰，資料層零 secrets）
#
# ⚠️ schedule 只從預設分支（main）觸發 → 本檔併入 main 才會定時跑。
# ⚠️ 本 workflow 不寫回 repo：data/ 快照的 git 落地由本機/手動流程負責；
#    CI 每次 checkout 後現抓現建（快照比對基準是 repo 內 committed 的上一版）。

name: racing weekly update

on:
  schedule:
    - cron: '0 22 * * 0'   # 週日 22:00 UTC = 台北週一 06:00（主更新）
    - cron: '0 22 * * 5'   # 週五 22:00 UTC = 台北週六 06:00（sprint 週末）
    - cron: '0 22 * * 6'   # 週六 22:00 UTC = 台北週日 06:00（sprint 週末）
  workflow_dispatch: {}

concurrency:
  group: racing-weekly
  cancel-in-progress: false

jobs:
  update:
    # ☠️ 2026-08-03 拿掉 `environment: production`（原本每次部署都要 Charlie 手動核准）。
    #
    # 拿掉的理由是實測數據，不是嫌麻煩——排程觸發的 run 只有第一次成功：
    #   07-25 22:55  ✅ 成功（12 步）← 設定當天，Charlie 人在旁邊按的
    #   07-26 23:01  ❌ 取消，實際執行 0 步
    #   07-31 22:48  ❌ 取消，實際執行 0 步
    #   08-01 22:55  ❌ 取消，實際執行 0 步（枯等 2 天）
    #   08-02 22:59  ❌ 取消，實際執行 0 步
    # 五次排程成功一次，其餘四次連一個步驟都沒跑過：開機 → 卡在等核准 → 沒人注意到 →
    # 被下次手動觸發擠掉。這個站真實的更新節奏因此不是「每週一自動更新」，
    # 而是「剛好有人在弄它的時候才更新」（R11 匈牙利就是 7/26 排程被取消、7/27 手動補的）。
    #
    # **一道需要人按、而那個人不在的 gate，不是 gate，是一個關掉的開關。**
    # 它比亮紅的 gate 更難發現，因為它「成功」的外觀就是什麼都沒發生。
    #
    # ⚠️ 這不是「拿掉審查」，是把審查移到它真的能發揮作用的那一層。
    # 部署那一刻沒有人審得動 374 頁，那一按必然退化成「對，我要部署」＝零資訊。
    # 現行政策（Charlie 2026-08-03）：**上線前開圓桌做 cross-check**，人在合併前看內容；
    # 合併之後的部署是機械的。查核桌 GO ≠ 合併授權，合併仍由 Charlie 明示。
    #
    # 部署前仍在的機械擋線（沒有任何一道被這次改動放鬆）：
    #   · tests.yml + 本檔的 unit tests 全綠才走
    #   · update-racing.py 的 hard gate：任何前置步驟失敗 → 禁止部署、正式站維持上一版
    #   · config/approved.json：文章預設拒絕 ＋ 綁 sha256（改過即失效、整篇下架）
    #   · check-site-facts.py：跨頁事實一致性
    #   · check-f1-invariants.py：失敗集合須恰等於宣告例外集合
    #   · check-encyclopedia-freshness.py：百科層與週更層賽曆必須一致
    #   · check-season-intros.py／check-zh.py：導言機械對帳、譯名一致性
    #
    # ⚠️ 若日後有人想把核准加回來：先看上面那張表。加回來的預期效果是「排程再次全部靜默停擺」。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python deps
        # pin 版本：後續步驟帶 CLOUDFLARE_API_TOKEN，防惡意 release 供應鏈
        run: pip install 'markdown==3.10.2' 'pyyaml==6.0.3'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 百科層測試（test_drivers_gen / test_encyclopedia_m7 等）要讀 data/f1/db.sqlite，
      # 而 L1 依設計不入版控（可由 committed 的 data/f1/raw/ 決定性重建）→ CI checkout 沒有它。
      # 少了這步，unittest 會整批 `no such table: driver_standings` 而讓部署卡死
      # （2026-07-25 排程 run 30132150509 實際踩到：M1+M2 併入後第一次排程就紅）。
      # tests.yml 早有這步，本檔漏掉——兩處必須同步。
      - name: Build f1 sqlite（百科層測試前置；tests.yml 同步）
        run: python scripts/build-f1-db.py

      # 排程也擋線（比照 baseball-daily.yml／basketball-daily.yml）：管線邏輯——部署 hard gate、
      # 草稿產物清理、快照驗證、sprint-only round 處理——壞掉時不會在畫面上立刻看見，
      # 只會在某個賽末默默出錯。這步讓它在部署前就紅。
      - name: Unit tests（deploy 前擋線）
        run: python -m unittest discover -s tests -v

      - name: Fetch → rebuild → deploy（cron 無新資料安靜跳過；手動 dispatch 一律強制重建）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # workflow_dispatch 帶 --force：手動跑就是要重建部署（否則首次部署/改版會被 quiet-skip 擋住）
        run: python scripts/update-racing.py --deploy ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
