<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:2400px; height:1260px; background:#f3e9e9; color:#241a1c;
  font-family:'Noto Sans TC',sans-serif; overflow:hidden; position:relative;
  background: radial-gradient(120% 80% at 20% -10%, #fbf3f3 0%, #f3e9e9 60%); }
.grid { position:absolute; inset:0; opacity:.12;
  background-image: linear-gradient(rgba(214,58,47,.30) 1px, transparent 1px),
    linear-gradient(90deg, rgba(214,58,47,.30) 1px, transparent 1px);
  background-size: 120px 120px; }
.wrap { position:relative; padding:110px 130px; height:100%; display:flex; flex-direction:column; }
.brand { font-family:'Chakra Petch'; font-style:italic; font-weight:700; font-size:44px;
  letter-spacing:6px; color:#d63a2f; }
.tag { font-family:'Chakra Petch'; font-size:26px; letter-spacing:10px; color:#786a6e; margin-top:10px; text-transform:uppercase; }
h1 { font-weight:900; font-size:120px; line-height:1.18; margin-top:60px; letter-spacing:2px; }
h1 .y { font-family:'Chakra Petch'; font-style:italic; color:#d63a2f; }
.sub { font-size:44px; color:#493c40; margin-top:34px; letter-spacing:2px; }
.viz { margin-top:auto; display:flex; gap:80px; align-items:flex-end; }
.chart { flex:1; }
.chart .lbl { font-family:'Chakra Petch'; font-size:28px; color:#786a6e; letter-spacing:4px; margin-bottom:18px; }
.bar { display:flex; height:86px; border-radius:14px; overflow:hidden; margin-bottom:14px; font-family:'Chakra Petch'; font-weight:700; }
.bar div { display:flex; align-items:center; padding-left:28px; font-size:30px; }
.ice { background:#191114; color:rgba(255,255,255,.82); }
.ele { background:#d63a2f; color:#fff; }
.legend { font-size:26px; color:#786a6e; margin-top:6px; letter-spacing:2px; }
.stats { display:flex; gap:56px; }
.stat { border-left:6px solid #d63a2f; padding-left:30px; }
.stat b { display:block; font-family:'Chakra Petch'; font-style:italic; font-size:70px; color:#d63a2f; }
.stat span { font-size:28px; color:#786a6e; letter-spacing:2px; }
.foot { position:absolute; bottom:44px; right:130px; font-size:24px; color:#a6989c; letter-spacing:2px; }
</style>
<style>h1{font-size:108px;margin-top:48px}.sub{font-size:38px;line-height:1.6}.viz{display:block}.cards{display:flex;gap:32px;margin-top:40px}.card{flex:1;min-height:270px;padding:34px;border-top:8px solid #d63a2f;background:rgba(255,255,255,.45);border-radius:8px}.card b{display:block;font-size:52px;line-height:1.4}.card small{display:block;margin-top:28px;font-family:'Chakra Petch';font-size:34px;color:#786a6e}.caption{font-size:27px;color:#786a6e;margin-top:24px}</style></head>
<body><div class="grid"></div><div class="wrap"><div class="brand">@RACING</div><div class="tag">賽車數據誌 · 2026 技術指南</div><h1>開翼與電力<br><span class="y">各自管什麼？</span></h1><div class="sub">主動空力、Overtake 與 Boost 的作用與使用條件</div><div class="viz"><div class="cards"><div class="card"><b>翼片位置</b><small>Active Aero<br>Straight Mode</small></div><div class="card"><b>電力曲線</b><small>Overtake</small></div><div class="card"><b>功率需求</b><small>Boost</small></div></div><div class="caption">三項機制，作用與開放條件各自說明</div></div><div class="foot">racing.twtools.cc · 依 FIA 2026 規章與 F1 官方說明</div></div></body></html>
