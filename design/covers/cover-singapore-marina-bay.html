<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* 上半部是桿位贏下正賽的比率前 4 名賽道（辦過至少 8 場的 20 條賽道），下半部是三個數字：
 * 14 屆都有安全車、16 屆有 4 屆被兩小時上限截短、16 屆桿位贏 11 屆。
 * 數字全部取自 facts/analysis-f1-singapore-marina-bay-safety-car-pole.json 的 derived_values。
 * 顏色不對應任何車隊塗裝（站規：不用官方素材）。 */
h1 { font-size: 88px; margin-top: 36px; line-height: 1.16; }
.sub { margin-top: 22px; font-size: 38px; }
table { margin-top: 32px; width: 100%; border-collapse: collapse; font-size: 32px; }
th { font-family: 'Chakra Petch'; font-size: 24px; letter-spacing: 4px; color: rgba(255,255,255,.8); text-align: left;
  background: #191114; padding: 10px 24px; }
td { padding: 12px 24px; border-bottom: 1.5px solid rgba(238,240,244,.12); }
td.nm { font-weight: 700; color: #241a1c; }
td.n { font-family: 'Chakra Petch'; font-weight: 700; color: #493c40; }
tr.me td { background: rgba(215,52,42,.10); }
.viz { margin-top: 26px; }
.lbl { margin-bottom: 10px; }
.stats { margin-top: 14px; gap: 40px; }
.stat { padding-left: 22px; }
.stat b { font-size: 48px; }
.stat b i { font-size: 28px; }
.stat span { font-size: 22px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <div class="tag">賽車數據誌 · 賽道百科</div>
  <h1>新加坡站14屆都有安全車<br>2024年<span class="y">第一次</span>沒有</h1>
  <div class="sub">桿位贏下正賽的比率排第2，但只有16屆的樣本</div>
  <table>
    <tr><th>賽道</th><th>桿位贏的屆數／總屆數</th><th>比率</th></tr>
    <tr><td class="nm">亞斯碼頭賽道（阿布達比）</td><td class="n">12／17</td><td class="n">70.6%</td></tr>
    <tr class="me"><td class="nm">濱海灣街道賽道（新加坡）</td><td class="n">11／16</td><td class="n">68.8%</td></tr>
    <tr><td class="nm">鈴鹿賽道</td><td class="n">10／15</td><td class="n">66.7%</td></tr>
    <tr><td class="nm">全庫平均（所有賽道）</td><td class="n">190／364</td><td class="n">52.2%</td></tr>
  </table>
  <div class="viz">
    <div class="lbl">新加坡站 2008 到 2025 年共 16 屆</div>
    <div class="stats">
      <div class="stat"><b>14<i>屆</i></b><span>每一屆至少出過一次安全車</span></div>
      <div class="stat"><b>4<i>屆</i></b><span>被兩小時上限截在預定圈數前</span></div>
      <div class="stat"><b>11<i>屆</i></b><span>桿位贏下正賽</span></div>
    </div>
  </div>
  <div class="foot">racing.twtools.cc · 資料庫基準第 15 站落地，不含 2026 年賽果</div>
</div>
</body>
</html>
