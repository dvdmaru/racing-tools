<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* 上半部是歷代前 3 名最年輕封王車手（維特爾／漢米爾頓／阿隆索），下半部是安東內利
 * 三個封王情境（新加坡／墨西哥城／阿布達比）的年齡，數字全部取自
 * facts/analysis-f1-youngest-world-champions.json 的 derived_values。
 * 顏色不對應任何車隊塗裝（站規：不用官方素材）。 */
h1 { font-size: 88px; margin-top: 36px; line-height: 1.16; }
.sub { margin-top: 22px; font-size: 38px; }
table { margin-top: 32px; width: 100%; border-collapse: collapse; font-size: 32px; }
th { font-family: 'Chakra Petch'; font-size: 24px; letter-spacing: 4px; color: rgba(255,255,255,.8); text-align: left;
  background: #191114; padding: 10px 24px; }
td { padding: 12px 24px; border-bottom: 1.5px solid rgba(238,240,244,.12); }
td.rk { font-family: 'Chakra Petch'; font-weight: 700; color: #786a6e; }
td.nm { font-weight: 700; color: #241a1c; }
td.age { font-family: 'Chakra Petch'; font-weight: 700; color: #493c40; }
.viz { margin-top: 26px; }
.lbl { margin-bottom: 10px; }
.stats { margin-top: 14px; gap: 40px; }
.stat { padding-left: 22px; }
.stat b { font-size: 48px; }
.stat b i { font-size: 28px; }
.stat span { font-size: 22px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <div class="tag">賽車數據誌 · 歷代紀錄</div>
  <h1>維特爾保持超過15年的<span class="y">最年輕</span>紀錄<br>安東內利最快這站就能打破</h1>
  <div class="sub">封王站不管落在哪裡，年齡都比維特爾年輕超過3年</div>
  <table>
    <tr><th>排名</th><th>車手（封王年）</th><th>年齡</th></tr>
    <tr><td class="rk">1</td><td class="nm">維特爾（2010）</td><td class="age">23歲又134天</td></tr>
    <tr><td class="rk">2</td><td class="nm">漢米爾頓（2008）</td><td class="age">23歲又300天</td></tr>
    <tr><td class="rk">3</td><td class="nm">阿隆索（2005）</td><td class="age">24歲又58天</td></tr>
  </table>
  <div class="viz">
    <div class="lbl">安東內利（2026）若在下列一站封王，當天年齡</div>
    <div class="stats">
      <div class="stat"><b>20<i>歲47天</i></b><span>新加坡站（10月11日）</span></div>
      <div class="stat"><b>20<i>歲68天</i></b><span>墨西哥城站（11月1日）</span></div>
      <div class="stat"><b>20<i>歲103天</i></b><span>賽季最後一戰阿布達比站</span></div>
    </div>
  </div>
  <div class="foot">racing.twtools.cc · 資料截至 2026-09-22（西班牙站後）</div>
</div>
</body>
</html>
