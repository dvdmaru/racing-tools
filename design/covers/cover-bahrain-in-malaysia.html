<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* 名稱與場地；2026一列依官方公告的歷史安排。 */
.wrap { padding: 70px 130px; }
h1 { font-size: 88px; margin-top: 28px; }
.sub { font-size: 34px; margin-top: 20px; }

.ledger { display: flex; flex-direction: column; gap: 12px; margin-bottom: 34px; }
.lrow { display: grid; grid-template-columns: 620px 1fr 400px; align-items: center;
  padding: 12px 24px; border-radius: 12px; background: rgba(255, 255, 255, .55); }
.lrow .nm { font-weight: 700; font-size: 32px; }
.lrow .nm i { display: block; font-family: 'Chakra Petch'; font-style: normal;
  font-size: 21px; color: #786a6e; letter-spacing: 2px; margin-top: 3px; }
.lrow .vn { text-align: right; font-weight: 700; font-size: 32px; color: #493c40; }
.lrow .vn i { display: block; font-family: 'Chakra Petch'; font-style: italic;
  font-size: 21px; color: #a6989c; letter-spacing: 2px; margin-top: 3px; }

/* 中間那條線刻意斷開＝名稱與地點對不上。虛線不是裝飾，是這篇的整個論點。 */
.gap { position: relative; height: 6px; margin: 0 34px; }
.gap::before { content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(90deg, #c9b9bc 0 22px, transparent 22px 40px); }
.gap::after { content: '≠'; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); background: #f6efef; padding: 0 20px;
  font-family: 'Chakra Petch'; font-weight: 700; font-size: 34px; color: #a6989c; }

.lrow.now { background: rgba(214, 58, 47, .10); box-shadow: inset 0 0 0 3px rgba(214, 58, 47, .38); }
.lrow.now .nm, .lrow.now .vn { color: #241a1c; }
.lrow.now .gap::before { background-image: repeating-linear-gradient(90deg, #d63a2f 0 22px, transparent 22px 40px); }
.lrow.now .gap::after { content: '≠'; background: #f8ecea; color: #d63a2f; }

.stats { margin-top: 0; }
.stats .stat b { font-size: 58px; }
.stats .stat span { font-size: 24px; }
.foot { font-size: 22px; letter-spacing: 0; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <div class="tag">賽車數據誌 · 深度專題</div>
  <h1>巴林大獎賽<br>移師<span class="y">馬來西亞</span></h1>
  <div class="sub">大獎賽的名字，不能直接當成地址</div>
  <div class="viz">
    <div class="lbl">名稱 ／ 舉辦國　·　歷史場次依本站世界錦標賽資料庫</div>
    <div class="ledger">
      <div class="lrow">
        <div class="nm">聖馬利諾大獎賽<i>SAN MARINO · 26 屆</i></div>
        <div class="gap"></div>
        <div class="vn">義大利<i>IMOLA</i></div>
      </div>
      <div class="lrow">
        <div class="nm">瑞士大獎賽<i>SWISS · 1982</i></div>
        <div class="gap"></div>
        <div class="vn">法國<i>DIJON-PRENOIS</i></div>
      </div>
      <div class="lrow now">
        <div class="nm">巴林大獎賽<i>BAHRAIN · 2026 公告安排</i></div>
        <div class="gap"></div>
        <div class="vn">馬來西亞<i>SEPANG</i></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>26</b><span>聖馬利諾大獎賽在伊莫拉</span></div>
      <div class="stat"><b>28</b><span>1954 至 1982 瑞士站相隔年數</span></div>
      <div class="stat"><b>19</b><span>雪邦的馬來西亞大獎賽</span></div>
    </div>
  </div>
  <div class="foot">racing.twtools.cc ・ 非官方資訊站 ・ 歷史場次依本站世界錦標賽資料；2026 依 F1 公告安排</div>
</div>
</body>
</html>
