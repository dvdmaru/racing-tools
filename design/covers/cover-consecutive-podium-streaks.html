<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
h1 { font-size: 112px; margin-top: 58px; }
.sub { margin-top: 20px; }
.series { display: grid; gap: 38px; margin-top: 74px; }
.row { display: grid; grid-template-columns: 585px 1fr 145px; align-items: center; gap: 38px; }
.label { font-size: 46px; font-weight: 700; }
.track { height: 24px; background: #dfd0d1; }
.bar { width: calc(var(--laps) / 19 * 100%); height: 100%; background: #76636a; }
.current .bar { background: #d63a2f; }
.row b { font: 700 75px/1 'Chakra Petch', system-ui, sans-serif; }
.current b { color: #ae3027; }
.foot { font-size: 28px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <h1>F1 連續登台紀錄</h1>
  <div class="sub">正賽連續進前三的場數</div>
  <div class="series">
    <div class="row" style="--laps:19"><span class="label">舒馬克・歷史最長</span><div class="track"><div class="bar"></div></div><b>19</b></div>
    <div class="row" style="--laps:15"><span class="label">維斯塔潘・個人最長</span><div class="track"><div class="bar"></div></div><b>15</b></div>
    <div class="row current" style="--laps:8"><span class="label">維斯塔潘・目前</span><div class="track"><div class="bar"></div></div><b>8</b></div>
  </div>
  <div class="foot">截至 2026 巴西站｜本站重算歷史賽果，表列紀錄核對 F1 官方成績</div>
</div>
</body>
</html>
