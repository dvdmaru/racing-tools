<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* Issue 09 的距離門檻對照。三條長條使用同一比例：每公里 4 px；
 * 305/290/260 公里對應寬度 1220/1160/1040。
 * 可見文字保留最少完整圈數、暖胎圈扣圈與排定／實跑的區別。 */
.chart { width: 100%; height: 400px; display: block; }
.chart .nm { font-family: 'Noto Sans TC'; font-weight: 500; font-size: 34px; fill: #493c40; }
.chart .vl { font-family: 'Chakra Petch'; font-style: italic; font-weight: 700;
  font-size: 46px; fill: #786a6e; }
.chart .vl.hi { fill: #d63a2f; font-size: 56px; }
h1 { font-size: 108px; margin-top: 44px; }
.sub { margin-top: 28px; }
.stats { margin-top: 36px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <div class="tag">賽車數據誌 · 規則</div>
  <h1>2027 正賽距離門檻<br>從 305 改為<span class="y">290 公里</span></h1>
  <div class="sub">FIA Issue 09 的 2027 年變更段落：摩納哥仍採 260 公里門檻</div>
  <div class="viz">
    <div class="lbl">一般以超過門檻的最少完整圈數排定正賽</div>
    <svg class="chart" viewBox="0 0 2100 480" role="img" aria-label="2026 與 Issue 09 所列 2027 正賽距離門檻對照，摩納哥另採 260 公里">
      <text x="0" y="80" class="nm">2026 一般門檻</text>
      <rect x="420" y="34" width="1220" height="64" rx="6" fill="#c9b8bb"/>
      <text x="1680" y="80" class="vl">305 公里</text>
      <text x="0" y="215" class="nm">2027 一般門檻</text>
      <rect x="420" y="169" width="1160" height="64" rx="6" fill="#d63a2f"/>
      <text x="1620" y="215" class="vl hi">290 公里</text>
      <text x="0" y="350" class="nm">摩納哥</text>
      <rect x="420" y="304" width="1040" height="64" rx="6" fill="#c9b8bb"/>
      <text x="1500" y="350" class="vl">260 公里</text>
      <text x="0" y="450" class="nm">暖胎圈在安全車後開始時，另依 B2.5.2(a) 扣圈；排定圈數不等於每場實際跑完的里程</text>
    </svg>
  </div>
  <div class="foot">racing.twtools.cc ・ 非官方資訊站 ・ 依 FIA Section B Issue 09，2027 年內確切生效日未載</div>
</div>
</body>
</html>
