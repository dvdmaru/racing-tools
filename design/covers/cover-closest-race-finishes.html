<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
h1 { font-size: 108px; margin-top: 38px; }
.sub { margin-top: 18px; }
.chart { margin-top: 140px; width: calc(100% - 220px); position: relative; height: 410px; }
.track { position: absolute; width: 100%; height: 18px; top: 188px; background: #bba7aa; }
.marker { position: absolute; left: var(--x); top: 197px; }
.marker::before { content: ""; position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: currentColor; }
.marker span { position: absolute; width: max-content; transform: translateX(-50%); top: 39px; text-align: center; font-size: 35px; font-weight: 700; }
.marker b { display: block; font: 700 70px/1 'Chakra Petch', system-ui, sans-serif; }
.marker.up span { top: auto; bottom: 39px; }
.marker.start span { transform: none; }
.marker.end span { transform: translateX(-30%); }
.end { color: #ae3027; }
.label { color: #574751; margin: 0; font-size: 30px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <h1>F1 前五名完賽差距</h1>
  <div class="sub">2026 拉斯維加斯站｜正式成績差距</div>
  <div class="chart">
    <div class="track"></div>
    <div class="marker start" style="--x: 0%"><span>維斯塔潘<br>冠軍</span></div>
    <div class="marker up" style="--x: 21.8312%"><span>諾里斯<b>0.639</b></span></div>
    <div class="marker" style="--x: 52.2378%"><span>皮亞斯特里<b>1.529</b></span></div>
    <div class="marker up" style="--x: 87.9399%"><span>安東內利<b>2.574</b></span></div>
    <div class="marker end" style="--x: 100%"><span>蓋斯利<b>2.927</b></span></div>
  </div>
  <p class="label">時間單位為秒 · 自冠軍起算</p>
  <div class="foot">依 FIA 最終正式成績</div>
</div>
</body>
</html>
