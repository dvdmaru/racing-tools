<!DOCTYPE html>

<style>

 * 資料＝racing-sepang 正賽事實包 derived_values.R1（F1 官方即時計時公開存檔，FastF1 解析）；終點點位用 Jolpica 官方差距 4.919，與計時過線差（第 55 圈約 4.83）不同口徑，所以圖上單獨標「官方終點」。

.chart { width: 100%; height: 500px; display: block; overflow: visible; }
.chart .tk { font-family: 'Noto Sans TC'; font-weight: 500; font-size: 34px; fill: #493c40; }
.chart .sp { font-family: 'Chakra Petch'; font-style: italic; font-weight: 700; font-size: 46px; fill: #241a1c; }
.chart .sp.hi { fill: #d63a2f; }
h1 { font-size: 100px; margin-top: 40px; }
.sub { margin-top: 24px; margin-bottom: 36px; font-size: 38px; }
</style>
</head>
