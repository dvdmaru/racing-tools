<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* 漢米爾頓與勒克萊爾對維斯塔潘的累計時間差（第 36 到第 62 圈，計時圈號），一圈一點連成線；
 * 資料＝roundtable 2026-10-12 r17_R_laps.csv 的逐圈 Time 欄（F1 官方即時計時公開存檔，FastF1 解析），
 * 同一圈該車過線時刻減維斯塔潘過線時刻；這是計時過線差，不是實際車距。
 * 橫軸線性：x = 70.0 + 1700 × (圈 − 36) ÷ 26；縱軸線性：y = 40.0 + 7.4 × 秒（維斯塔潘 = 0 在最上，越往下越落後）。
 * 只標正文出現的數字（第 39 圈、第 40 圈、7.996、53.188、22 圈、45.192），不畫座標刻度；勒克萊爾那條線不標數字。
 * 座標由 tmp/gen_cover_r17.py 算出，不手調。顏色只區分兩條線，不對應車隊塗裝。 */
.chart { width: 100%; height: 560px; display: block; overflow: visible; }
.chart .tk { font-family: 'Noto Sans TC'; font-weight: 500; font-size: 34px; fill: #493c40; }
.chart .dn { font-family: 'Noto Sans TC'; font-weight: 700; font-size: 38px; fill: #493c40; }
.chart .dn.hi { fill: #d63a2f; }
.chart .sp { font-family: 'Chakra Petch'; font-style: italic; font-weight: 700; font-size: 46px; fill: #241a1c; }
.chart .sp.hi { fill: #d63a2f; }
h1 { font-size: 104px; margin-top: 40px; }
.sub { margin-top: 24px; margin-bottom: 30px; font-size: 38px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">

  <div class="tag">賽車數據誌 · 正賽</div>

  <div class="sub">最後 22 圈漢米爾頓對維斯塔潘多掉 <span class="y">45.192 秒</span>；差距是過線時間差，不是實際車距</div>
