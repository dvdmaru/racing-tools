<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
/* 領跑權條帶：72 圈按領跑者切段，每段寬度用 flex-grow 直接等於圈數，
 * 不手算百分比——寬度與圈數不可能對不上。段落順序與圈數取自 facts pack timeline.lead_changes
 * （易主圈 5／22／25／40／48／54）。色階只用來區分三位車手，不對應任何車隊塗裝。 */
.strip { display: flex; height: 132px; border-radius: 14px; overflow: hidden; }
.seg { position: relative; display: flex; flex-direction: column; justify-content: center;
  padding-left: 22px; font-family: 'Chakra Petch'; font-weight: 700; overflow: hidden; }
.seg .lap { font-size: 22px; letter-spacing: 2px; opacity: .72; }
.seg .who { font-family: 'Noto Sans TC'; font-weight: 700; font-size: 30px; letter-spacing: 1px; white-space: nowrap; }
.s-nor { background: #d63a2f; color: #fff; }
.s-ant { background: #191114; color: rgba(255, 255, 255, .88); }
.s-ham { background: #786a6e; color: #fff; }
.keys { display: flex; gap: 44px; margin-top: 18px; font-size: 27px; color: #493c40; letter-spacing: 1px; }
.keys i { display: inline-block; width: 30px; height: 16px; border-radius: 4px; margin-right: 12px; vertical-align: 1px; }
.stats { margin-top: 46px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand">@RACING</div>
  <div class="tag">賽車數據誌 · 戰報</div>
  <h1>荷蘭站戰報<br>領先易主 <span class="y">6</span> 次</h1>
  <div class="sub">諾里斯第 1 位發車奪冠 ・ 3 位車手領跑過 ・ 冠軍只領跑 31 圈</div>
  <div class="viz">
    <div class="lbl">72 圈的領跑權（每段寬度＝領跑圈數）</div>
    <div class="strip">
      <div class="seg s-nor" style="flex:4"><span class="lap">LAP 1</span><span class="who">4</span></div>
      <div class="seg s-ant" style="flex:17"><span class="lap">5</span><span class="who">安東內利 17</span></div>
      <div class="seg s-ham" style="flex:3"><span class="lap">22</span></div>
      <div class="seg s-ant" style="flex:15"><span class="lap">25</span><span class="who">15</span></div>
      <div class="seg s-nor" style="flex:8"><span class="lap">40</span><span class="who">8</span></div>
      <div class="seg s-ham" style="flex:6"><span class="lap">48</span><span class="who">6</span></div>
      <div class="seg s-nor" style="flex:19"><span class="lap">54</span><span class="who">諾里斯 19</span></div>
    </div>
    <div class="keys">
      <span><i style="background:#d63a2f"></i>諾里斯 31 圈</span>
      <span><i style="background:#191114"></i>安東內利 32 圈</span>
      <span><i style="background:#786a6e"></i>漢米爾頓 9 圈</span>
    </div>
    <div class="stats">
      <div class="stat"><b>31</b><span>冠軍領跑圈數／共 72 圈</span></div>
      <div class="stat"><b>6</b><span>領先易主次數</span></div>
      <div class="stat"><b>3</b><span>領跑過的車手</span></div>
    </div>
  </div>
  <div class="foot">racing.twtools.cc ・ 非官方資訊站 ・ 圈數依官方分類與逐圈資料</div>
</div>
</body>
</html>
