h1 { font-size: 104px; margin-top: 26px; }
.sub { margin-top: 26px; margin-bottom: 22px; font-size: 40px; }
.legend { margin-bottom: 18px; }
.stats { margin-top: 24px; }
.wrap { padding-bottom: 96px; }
